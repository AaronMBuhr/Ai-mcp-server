defaults:
  temperature: 0.2
  max_output_tokens: 8000
  timeout_seconds: 180
  max_retries: 3
  retry_base_seconds: 30

providers:
  chatgpt:
    type: openai
    api_key_env_var: OPENAI_API_KEY
    models:
      low:
        model: gpt-4.1-mini
        temperature: 0.2
        max_output_tokens: 4000
      middle:
        model: gpt-4.1
        temperature: 0.2
        max_output_tokens: 8000
      high:
        model: o3
        temperature: 0.1
        max_output_tokens: 12000

  gemini:
    type: gemini
    api_key_env_var: GEMINI_API_KEY
    models:
      low:
        model: gemini-2.0-flash
        temperature: 0.2
        max_output_tokens: 4000
      middle:
        model: gemini-2.5-flash
        temperature: 0.2
        max_output_tokens: 8000
      high:
        model: gemini-2.5-pro
        temperature: 0.1
        max_output_tokens: 12000

  claude:
    type: anthropic
    api_key_env_var: ANTHROPIC_API_KEY
    models:
      low:
        model: claude-haiku-4-20250414
        temperature: 0.2
        max_output_tokens: 4000
      middle:
        model: claude-sonnet-4-20250514
        temperature: 0.2
        max_output_tokens: 8000
      high:
        model: claude-opus-4-20250514
        temperature: 0.1
        max_output_tokens: 12000
